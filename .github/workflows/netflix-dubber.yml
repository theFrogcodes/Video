name: Netflix Dubber (macOS)

on:
  push:
    paths:
      - "NetflixDubber/**"
      - ".github/workflows/netflix-dubber.yml"
  pull_request:
    paths:
      - "NetflixDubber/**"
      - ".github/workflows/netflix-dubber.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Also build a release .app and upload it as an artifact"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compiles and tests the platform-independent core (DubberCore) with the
  # Linux Swift toolchain: fast feedback that doesn't need a macOS runner.
  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Core-only package
        run: |
          mkdir -p /tmp/core
          cp -R NetflixDubber/Sources NetflixDubber/Tests /tmp/core/
          rm -rf /tmp/core/Sources/NetflixDubber
          cat > /tmp/core/Package.swift <<'MANIFEST'
          // swift-tools-version:5.10
          import PackageDescription
          let package = Package(
              name: "DubberCore",
              targets: [
                  .target(name: "DubberCore"),
                  .testTarget(name: "DubberCoreTests", dependencies: ["DubberCore"]),
              ]
          )
          MANIFEST
      - name: Build and test
        working-directory: /tmp/core
        run: swift test

  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: NetflixDubber
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            NetflixDubber/.build/repositories
            NetflixDubber/.build/artifacts
          key: spm-${{ runner.os }}-${{ hashFiles('NetflixDubber/Package.swift', 'NetflixDubber/Package.resolved') }}

      - name: Build (app + tests)
        run: swift build --build-tests

      - name: Unit tests
        run: swift test --skip-build --filter DubberCoreTests

      - name: Package .app (debug) and verify bundle
        run: |
          ./scripts/build-app.sh debug
          plutil -lint "build/Netflix Dubber.app/Contents/Info.plist"
          otool -L "build/Netflix Dubber.app/Contents/MacOS/NetflixDubber" | head -40
          codesign --verify --verbose "build/Netflix Dubber.app"

      - name: Release build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          ./scripts/build-app.sh release
          ditto -c -k --keepParent "build/Netflix Dubber.app" "build/NetflixDubber.zip"

      - name: Upload app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: NetflixDubber-app
          path: NetflixDubber/build/NetflixDubber.zip
